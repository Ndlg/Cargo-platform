name: cargo-platform-validation

services:
  redis:
    image: redis:7-alpine
    container_name: cargo-platform-validation-redis
    volumes:
      - validation-redis-data:/data
    networks:
      - validation

  waybill-parser:
    image: cargo-platform-validation-parser:stage-14-66d2959
    container_name: cargo-platform-validation-parser
    ports:
      - "127.0.0.1:18010:8010"
    networks:
      validation:
        aliases:
          - waybill-parser

  backend:
    image: cargo-platform-validation-backend:stage-17-7bd0d9f
    container_name: cargo-platform-validation-backend
    depends_on:
      - redis
      - waybill-parser
    environment:
      APP_NAME: Cargo Platform Validation
      DEFAULT_WORKSPACE_ID: "1"
      APP_VERSION: 7bd0d9f
      CORS_ORIGINS: http://127.0.0.1:6173,http://localhost:6173
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      LANG: C.UTF-8
      REDIS_URL: redis://redis:6379/0
      API_PREFIX: /api/v1
      AUTO_CREATE_TABLES: "true"
      DATABASE_URL: sqlite:////data/cargo-platform.db
      STORAGE_ROOT: /data/workspaces
      PYTHONUNBUFFERED: "1"
      WAYBILL_PARSER_URL: http://waybill-parser:8010
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - validation-data:/data
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      validation:
        aliases:
          - backend

  ui:
    image: cargo-platform-validation-ui:stage-17-7bd0d9f
    container_name: cargo-platform-validation-ui
    depends_on:
      - backend
    environment:
      API_PROXY_PASS: http://backend:8000
      SPA_FALLBACK: /index.html
    ports:
      - "127.0.0.1:6173:80"
    networks:
      validation:
        aliases:
          - validation-ui

volumes:
  validation-data:
    external: true
    name: cargo-platform-validation-data-20260728-165426-latest
  validation-redis-data:
    external: true
    name: 6903b378eba3905b4cef1320b9122cfe4f6b1c082e597576db6f312a9440506f

networks:
  validation:
    external: true
    name: cargo-platform-validation-20260727-014134
