services:
  backend:
    image: ${VALIDATION_BACKEND_IMAGE:?set VALIDATION_BACKEND_IMAGE}
    environment:
      APP_VERSION: ${VALIDATION_APP_VERSION:?set VALIDATION_APP_VERSION}

  waybill-parser:
    image: ${VALIDATION_PARSER_IMAGE:?set VALIDATION_PARSER_IMAGE}
    environment:
      APP_VERSION: ${VALIDATION_APP_VERSION:?set VALIDATION_APP_VERSION}

  ai-recognition:
    image: ${VALIDATION_AI_IMAGE:?set VALIDATION_AI_IMAGE}
    environment:
      APP_VERSION: ${VALIDATION_APP_VERSION:?set VALIDATION_APP_VERSION}

  ui:
    image: ${VALIDATION_UI_IMAGE:?set VALIDATION_UI_IMAGE}

volumes:
  validation-data:
    external: true
    name: ${VALIDATION_PLATFORM_VOLUME:?set VALIDATION_PLATFORM_VOLUME}
  validation-redis-data:
    external: true
    name: ${VALIDATION_REDIS_VOLUME:?set VALIDATION_REDIS_VOLUME}
  ai-session-data:
    external: true
    name: ${VALIDATION_AI_SESSION_VOLUME:?set VALIDATION_AI_SESSION_VOLUME}
