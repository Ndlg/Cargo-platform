<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地 AI 面单识别会话</title>
    <style>
      body { margin: 0; color: #1f2937; background: #f3f4f6; font: 14px/1.5 system-ui, sans-serif; }
      main { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
      header, article, section.stage { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
      h1, h2, h3 { margin: 0 0 12px; }
      button { padding: 8px 14px; margin-right: 8px; border: 1px solid #2563eb; border-radius: 6px; background: white; color: #2563eb; cursor: pointer; }
      button.primary { color: white; background: #2563eb; }
      button:disabled { cursor: wait; opacity: .65; }
      input { box-sizing: border-box; width: 100%; min-width: 100px; padding: 7px 8px; border: 1px solid #d1d5db; border-radius: 5px; }
      textarea { box-sizing: border-box; width: 100%; min-height: 80px; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
      .result-table { overflow-x: auto; margin: 12px 0 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px 12px; border: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
      th { background: #f8fafc; color: #475569; white-space: nowrap; }
      td code { color: #334155; overflow-wrap: anywhere; }
      .input-value { white-space: pre-wrap; overflow-wrap: anywhere; }
      .muted { color: #6b7280; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>本地 AI 面单识别会话</h1>
        <p class="muted">模型候选、管理员五字段结果和规则编译结果分别留存；确认后才会同步识别规则。</p>
      </header>
      <p id="operation-error" class="error" role="alert"></p>
      <p id="operation-status" class="muted" role="status"></p>
      <section id="session"></section>
    </main>
    <script>
      const selected = new URLSearchParams(location.search).get("session");
      const validSessionId = (value) => /^[A-Za-z0-9_-]{1,128}$/.test(value || "");
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      const displayValue = (value) => value === null || value === undefined || value === "" ? "-" : escapeHtml(value);
      const statusText = (status) => ({
        model_running: "正在解析",
        approving: "正在同步规则",
        ai_rule_pending: "等待管理员确认",
        ai_rule_invalid: "规则校验未通过",
        ai_result_invalid: "识别结果需修改",
        ai_parse_failed: "解析失败",
        candidate_invalid: "候选结果需修改",
        ai_unavailable: "本地 AI 不可用",
        approved: "已确认并同步",
        rejected: "已拒绝",
      })[status] || "待处理";
      const editableStatuses = ["ai_rule_pending", "candidate_invalid", "ai_rule_invalid", "ai_result_invalid"];
      const candidateRows = (candidate) => (candidate?.parents || []).flatMap((parent) => Array.isArray(parent?.rows) ? parent.rows : []);
      const apiPath = (suffix = "") => `/api/v1/ai-recognition/sessions/${encodeURIComponent(selected)}${suffix}`;
      let currentSession = null;
      let pollTimer;
      let busy = false;

      function requestHeaders(json = false) {
        const token = localStorage.getItem("cargo-platform-token");
        const workspaceId = localStorage.getItem("cargo-platform-workspace-id");
        return {
          ...(json ? { "Content-Type": "application/json" } : {}),
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(workspaceId ? { "X-Workspace-Id": workspaceId } : {}),
        };
      }

      async function request(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: { ...requestHeaders(Boolean(options.body)), ...(options.headers || {}) },
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok) throw new Error(payload?.detail || (response.status === 401 ? "登录状态已失效，请重新登录。" : "操作失败，请稍后重试。"));
        return payload;
      }

      function flattenInput(value, path = "", rows = []) {
        if (Array.isArray(value)) {
          value.forEach((item, index) => flattenInput(item, `${path}[${index}]`, rows));
        } else if (value && typeof value === "object") {
          Object.entries(value).forEach(([key, item]) => flattenInput(item, path ? `${path}.${key}` : key, rows));
        } else if (path) {
          rows.push({ path, value });
        }
        return rows;
      }

      function modelInput(session) {
        const fields = flattenInput(session.model_input?.sanitized_payload);
        if (!fields.length) return "";
        return `
          <section class="stage">
            <h3>实际脱敏模型输入</h3>
            <p class="muted">以下是模型实际收到的证据片段 ID、标签和短值；原始路径和收件信息未传入。</p>
            <div class="result-table">
              <table aria-label="实际脱敏模型输入">
                <thead><tr><th>模型输入项</th><th>实际传入值</th></tr></thead>
                <tbody>${fields.map((field) => `
                  <tr><td><code>${escapeHtml(field.path)}</code></td><td class="input-value">${displayValue(field.value)}</td></tr>
                `).join("")}</tbody>
              </table>
            </div>
          </section>`;
      }

      function businessTable(title, rows, { editable = false, id = "" } = {}) {
        const cell = (field, value, type = "text") => editable
          ? `<input data-field="${field}" type="${type}"${type === "number" ? ' min="1" step="1"' : ""} value="${escapeHtml(value ?? (type === "number" ? 1 : ""))}" />`
          : displayValue(value);
        const rowHtml = (item = {}) => `
          <tr>
            <td>${cell("product", item.product)}</td>
            <td>${cell("sales_attr1", item.sales_attr1)}</td>
            <td>${cell("sales_attr2", item.sales_attr2)}</td>
            <td>${cell("quantity", item.quantity, "number")}</td>
            <td>${cell("remark", item.remark)}</td>
            ${editable ? '<td><button type="button" onclick="if (this.closest(\'tbody\').rows.length > 1) this.closest(\'tr\').remove()">删除</button></td>' : ""}
          </tr>`;
        const shownRows = rows.length ? rows : (editable ? [{}] : []);
        return `
          <section class="stage">
            <h3>${escapeHtml(title)}</h3>
            ${shownRows.length ? `
              <div class="result-table">
                <table aria-label="${escapeHtml(title)}">
                  <thead><tr><th>商品</th><th>销售属性1</th><th>销售属性2</th><th>数量</th><th>备注</th>${editable ? "<th>操作</th>" : ""}</tr></thead>
                  <tbody${id ? ` id="${id}"` : ""}>${shownRows.map(rowHtml).join("")}</tbody>
                </table>
              </div>` : '<p class="muted">暂无结果。</p>'}
          </section>`;
      }

      function compilerResult(result) {
        if (!result) return '<section class="stage"><h3>规则编译结果</h3><p class="muted">尚未编译。</p></section>';
        return `
          <section class="stage">
            <h3>规则编译结果</h3>
            <div class="result-table">
              <table aria-label="规则编译结果">
                <tbody>
                  <tr><th>状态</th><td>${displayValue(result.status)}</td></tr>
                  <tr><th>格式指纹</th><td><code>${displayValue(result.fingerprint || result.format_fingerprint)}</code></td></tr>
                  <tr><th>语法签名</th><td><code>${displayValue(result.grammar_signature)}</code></td></tr>
                  <tr><th>回放校验</th><td>${Array.isArray(result.replay_report) ? `${result.replay_report.length} 项` : "-"}</td></tr>
                </tbody>
              </table>
            </div>
          </section>`;
      }

      function actions(session) {
        if (session.status === "model_running") return "<p>模型正在解析这一张面单，请稍候……</p>";
        if (session.status === "approving") return "<p>规则正在校验并同步，请稍候……</p>";
        if (session.status === "approved") return "<p>已确认，新规则已经同步到系统。</p>";
        if (!editableStatuses.includes(session.status)) return "";
        return [
          '<textarea id="feedback-note" placeholder="可选：补充说明这类面单应如何读取"></textarea>',
          "<p>",
          '<button type="button" onclick="addRow()">添加商品行</button>',
          '<button class="primary" type="button" id="confirm-button" onclick="confirmAndSync()">确认并同步规则</button>',
          '<button type="button" onclick="rejectCandidate()">拒绝候选</button>',
          "</p>",
        ].join("");
      }

      function render(session) {
        const modelRows = candidateRows(session.model_candidate);
        const administratorRows = Array.isArray(session.administrator_rows) ? session.administrator_rows : [];
        const editable = editableStatuses.includes(session.status);
        const editRows = administratorRows.length ? administratorRows : modelRows;
        document.querySelector("#session").innerHTML = `
          <article>
            <h2>识别结果 · ${statusText(session.status)}</h2>
            ${session.error ? `<p class="error">${escapeHtml(session.error)}</p>` : ""}
            ${modelInput(session)}
            ${businessTable("模型原始候选", modelRows)}
            ${businessTable("管理员五字段结果", editable ? editRows : administratorRows, { editable, id: "administrator-result" })}
            ${compilerResult(session.compiler_result)}
            ${actions(session)}
          </article>`;
      }

      async function load() {
        clearTimeout(pollTimer);
        if (!validSessionId(selected)) throw new Error("缺少有效的 AI 会话编号。");
        currentSession = await request(apiPath());
        render(currentSession);
        if (["model_running", "approving"].includes(currentSession.status)) pollTimer = setTimeout(() => load().catch(showError), 2000);
      }

      function readEditedRows() {
        const table = document.querySelector("#administrator-result");
        return [...table.querySelectorAll("tr")].map((row) => {
          const value = (field) => row.querySelector(`[data-field="${field}"]`).value.trim();
          return {
            product: value("product"),
            sales_attr1: value("sales_attr1"),
            sales_attr2: value("sales_attr2"),
            quantity: Number(value("quantity")),
            remark: value("remark"),
          };
        });
      }

      function addRow() {
        const table = document.querySelector("#administrator-result");
        const row = table.querySelector("tr").cloneNode(true);
        row.querySelectorAll("input").forEach((input) => { input.value = input.type === "number" ? "1" : ""; });
        table.appendChild(row);
      }

      async function waitForCandidate() {
        for (let attempt = 0; attempt < 150; attempt += 1) {
          const session = await request(apiPath());
          if (session.status !== "model_running") return session;
          await new Promise((resolve) => setTimeout(resolve, 2000));
        }
        return { status: "model_running" };
      }

      async function confirmAndSync() {
        if (busy) return;
        busy = true;
        const button = document.querySelector("#confirm-button");
        const status = document.querySelector("#operation-status");
        if (button) {
          button.disabled = true;
          button.textContent = "正在处理…";
        }
        status.textContent = "正在保存管理员结果并生成、校验规则，请稍候。";
        try {
          const rows = readEditedRows();
          if (rows.some((row) => !row.product || !Number.isInteger(row.quantity) || row.quantity < 1)) {
            window.alert("商品不能为空，数量必须是大于 0 的整数。");
            return;
          }
          await request(apiPath("/feedback"), {
            method: "POST",
            body: JSON.stringify({
              corrected_rows: rows,
              note: document.querySelector("#feedback-note").value.trim(),
            }),
          });
          const session = await waitForCandidate();
          if (session.status !== "ai_rule_pending") throw new Error(session.error || "规则还不能通过校验，请继续修改后再确认。");
          const approved = await request(apiPath("/approve"), { method: "POST" });
          if (approved.status === "approved") window.parent.postMessage({ type: "cargo-ai-rule-approved" }, location.origin);
          await load();
        } catch (error) {
          showError(error);
        } finally {
          busy = false;
          status.textContent = "";
        }
      }

      async function rejectCandidate() {
        try {
          await request(apiPath("/reject"), { method: "POST" });
          await load();
        } catch (error) {
          showError(error);
        }
      }

      function showError(error) {
        document.querySelector("#operation-error").textContent = error instanceof Error ? error.message : "操作失败，请稍后重试。";
      }

      load().catch(showError);
    </script>
  </body>
</html>
