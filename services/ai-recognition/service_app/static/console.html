<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地 AI 面单识别会话</title>
    <style>
      body { margin: 0; color: #1f2937; background: #f3f4f6; font: 14px/1.5 system-ui, sans-serif; }
      main { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
      header, article { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
      h1, h2 { margin: 0 0 12px; }
      button { padding: 8px 14px; margin-right: 8px; border: 1px solid #2563eb; border-radius: 6px; background: white; color: #2563eb; cursor: pointer; }
      button.primary { color: white; background: #2563eb; }
      textarea { box-sizing: border-box; width: 100%; min-height: 80px; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
      .result-table { overflow-x: auto; margin: 12px 0 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px 12px; border: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
      th { background: #f8fafc; color: #475569; white-space: nowrap; }
      .muted { color: #6b7280; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>本地 AI 面单识别会话</h1>
        <p class="muted">这里只确认陌生面单格式和候选解析规则，不维护商品、SKU、图片或档口。</p>
      </header>
      <section id="sessions"></section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const selected = params.get("session");
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      const displayValue = (value) => value === null || value === undefined || value === "" ? "-" : escapeHtml(value);
      const statusText = (status) => ({
        model_running: "正在解析",
        ai_rule_pending: "等待管理员确认",
        ai_parse_failed: "解析失败",
        approved: "已确认并同步",
        rejected: "已拒绝",
      })[status] || "待处理";
      const candidateRows = (session) => (session.candidate?.parents || []).flatMap((parent) => Array.isArray(parent?.rows) ? parent.rows : []);
      function candidateResult(session) {
        const rows = candidateRows(session);
        if (!rows.length) return session.status === "model_running"
          ? '<p class="muted">模型正在解析，完成后会在这里显示结果。</p>'
          : '<p class="muted">本次没有生成可确认的商品行。</p>';
        return `
          <div class="result-table">
            <table aria-label="AI 识别结果">
              <thead><tr><th>商品</th><th>销售属性1</th><th>销售属性2</th><th>数量</th><th>备注</th></tr></thead>
              <tbody>${rows.map((item) => `
                <tr>
                  <td>${displayValue(item.product)}</td>
                  <td>${displayValue(item.sales_attr1)}</td>
                  <td>${displayValue(item.sales_attr2)}</td>
                  <td>${displayValue(item.quantity)}</td>
                  <td>${displayValue(item.remark)}</td>
                </tr>
              `).join("")}</tbody>
            </table>
          </div>`;
      }
      async function post(url, body) {
        const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
        if (!response.ok) throw new Error(await response.text());
        const payload = await response.json();
        await load();
        if (payload.status === "approved") window.parent.postMessage({ type: "cargo-ai-rule-approved" }, "*");
      }
      function actions(row) {
        if (row.status === "model_running") return "<p>模型正在解析这一张面单，请稍候……</p>";
        if (row.status === "approved") return "<p>已确认，新规则已经同步到系统。</p>";
        if (row.status !== "ai_rule_pending") return "";
        return [
          `<textarea id="feedback-${row.session_id}" placeholder="指出错误字段，模型会重新生成候选"></textarea>`,
          "<p>",
          `<button onclick="sendFeedback('${row.session_id}')">发送反馈并重新识别</button>`,
          `<button class="primary" onclick="post('/api/v1/sessions/${row.session_id}/approve')">确认并同步为规则</button>`,
          `<button onclick="post('/api/v1/sessions/${row.session_id}/reject')">拒绝候选</button>`,
          "</p>",
        ].join("");
      }
      let pollTimer;
      async function load() {
        clearTimeout(pollTimer);
        const url = selected ? `/api/v1/sessions/${encodeURIComponent(selected)}` : "/api/v1/sessions";
        const response = await fetch(url);
        const payload = await response.json();
        const rows = Array.isArray(payload) ? payload : [payload];
        document.querySelector("#sessions").innerHTML = rows.map((row) => `
          <article>
            <h2>识别结果 · ${statusText(row.status)}</h2>
            ${candidateResult(row)}
            ${actions(row)}
          </article>
        `).join("");
        if (rows.some((row) => row.status === "model_running")) pollTimer = setTimeout(load, 2000);
      }
      function sendFeedback(id) {
        const message = document.querySelector(`#feedback-${id}`).value.trim();
        if (message) post(`/api/v1/sessions/${id}/feedback`, { message });
      }
      load().catch((error) => { document.querySelector("#sessions").textContent = error.message; });
    </script>
  </body>
</html>
