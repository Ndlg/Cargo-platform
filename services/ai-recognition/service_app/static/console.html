<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地 AI 面单识别会话</title>
    <style>
      body { margin: 0; color: #1f2937; background: #f3f4f6; font: 14px/1.5 system-ui, sans-serif; }
      main { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
      header, article { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
      h1, h2 { margin: 0 0 12px; }
      button { padding: 8px 14px; margin-right: 8px; border: 1px solid #2563eb; border-radius: 6px; background: white; color: #2563eb; cursor: pointer; }
      button.primary { color: white; background: #2563eb; }
      button:disabled { cursor: wait; opacity: .65; }
      input { box-sizing: border-box; width: 100%; min-width: 100px; padding: 7px 8px; border: 1px solid #d1d5db; border-radius: 5px; }
      textarea { box-sizing: border-box; width: 100%; min-height: 80px; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
      .result-table { overflow-x: auto; margin: 12px 0 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px 12px; border: 1px solid #e5e7eb; text-align: left; vertical-align: top; }
      th { background: #f8fafc; color: #475569; white-space: nowrap; }
      td code { color: #334155; overflow-wrap: anywhere; }
      .input-value { white-space: pre-wrap; overflow-wrap: anywhere; }
      .muted { color: #6b7280; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>本地 AI 面单识别会话</h1>
        <p class="muted">这里只确认陌生面单格式和候选解析规则，不维护商品、SKU、图片或档口。</p>
      </header>
      <p id="operation-error" class="error" role="alert"></p>
      <p id="operation-status" class="muted" role="status"></p>
      <section id="sessions"></section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const selected = params.get("session");
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
      const displayValue = (value) => value === null || value === undefined || value === "" ? "-" : escapeHtml(value);
      const statusText = (status) => ({
        model_running: "正在解析",
        approving: "正在同步规则",
        ai_rule_pending: "等待管理员确认",
        ai_rule_invalid: "规则校验未通过",
        ai_result_invalid: "识别结果需修改",
        ai_parse_failed: "解析失败",
        candidate_invalid: "候选结果需修改",
        ai_unavailable: "本地 AI 不可用",
        approved: "已确认并同步",
        rejected: "已拒绝",
      })[status] || "待处理";
      const candidateRows = (session) => (session.candidate?.parents || []).flatMap((parent) => Array.isArray(parent?.rows) ? parent.rows : []);
      const editableStatuses = ["ai_rule_pending", "candidate_invalid", "ai_rule_invalid", "ai_result_invalid"];
      let sessionsById = {};
      function flattenInput(value, path = "", rows = []) {
        if (Array.isArray(value)) {
          value.forEach((item, index) => flattenInput(item, `${path}[${index}]`, rows));
        } else if (value && typeof value === "object") {
          Object.entries(value).forEach(([key, item]) => flattenInput(item, path ? `${path}.${key}` : key, rows));
        } else if (path) {
          rows.push({ path, value });
        }
        return rows;
      }
      function modelInput(session) {
        const fields = flattenInput(session.model_input?.sanitized_payload);
        if (!fields.length) return "";
        return `
          <section>
            <h3>本次传给 AI 的字段</h3>
            <p class="muted">以下是模型实际收到的证据片段 ID、标签和短值；原始路径、收件信息、订单号和快递单号未传入。</p>
            <div class="result-table">
              <table aria-label="本次传给 AI 的字段">
                <thead><tr><th>模型输入项</th><th>实际传入值</th></tr></thead>
                <tbody>${fields.map((field) => `
                  <tr>
                    <td><code>${escapeHtml(field.path)}</code></td>
                    <td class="input-value">${displayValue(field.value)}</td>
                  </tr>
                `).join("")}</tbody>
              </table>
            </div>
          </section>`;
      }
      function candidateResult(session) {
        const rows = candidateRows(session);
        if (!rows.length && session.status === "model_running") {
          return '<p class="muted">模型正在解析，完成后会在这里显示结果。</p>';
        }
        const editable = editableStatuses.includes(session.status);
        if (!rows.length && !editable) return '<p class="muted">本次没有生成可确认的商品行。</p>';
        const cell = (field, value, type = "text") => editable
          ? `<input data-field="${field}" type="${type}"${type === "number" ? ' min="1" step="1"' : ""} value="${escapeHtml(value)}" />`
          : displayValue(value);
        const rowHtml = (item = {}) => `
          <tr>
            <td>${cell("product", item.product)}</td>
            <td>${cell("sales_attr1", item.sales_attr1)}</td>
            <td>${cell("sales_attr2", item.sales_attr2)}</td>
            <td>${cell("quantity", item.quantity ?? 1, "number")}</td>
            <td>${cell("remark", item.remark)}</td>
            ${editable ? '<td><button type="button" onclick="if (this.closest(\'tbody\').rows.length > 1) this.closest(\'tr\').remove()">删除</button></td>' : ""}
          </tr>`;
        return `
          <div class="result-table">
            <table aria-label="AI 识别结果">
              <thead><tr><th>商品</th><th>销售属性1</th><th>销售属性2</th><th>数量</th><th>备注</th>${editable ? "<th>操作</th>" : ""}</tr></thead>
              <tbody id="result-${session.session_id}">${(rows.length ? rows : [{}]).map(rowHtml).join("")}</tbody>
            </table>
          </div>`;
      }
      async function post(url, body, reload = true) {
        const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
        if (!response.ok) {
          const error = await response.json().catch(() => null);
          document.querySelector("#operation-error").textContent = error?.detail || "操作失败，请稍后重试。";
          return;
        }
        document.querySelector("#operation-error").textContent = "";
        const payload = await response.json();
        if (reload) await load();
        if (payload.status === "approved") window.parent.postMessage({ type: "cargo-ai-rule-approved" }, "*");
        return payload;
      }
      function actions(row) {
        if (row.status === "model_running") return "<p>模型正在解析这一张面单，请稍候……</p>";
        if (row.status === "approving") return "<p>规则正在校验并同步，请稍候……</p>";
        if (row.status === "approved") return "<p>已确认，新规则已经同步到系统。</p>";
        if (!["ai_rule_pending", "candidate_invalid", "ai_rule_invalid", "ai_result_invalid"].includes(row.status)) return "";
        return [
          `<textarea id="feedback-${row.session_id}" placeholder="可选：补充说明这类面单应如何读取"></textarea>`,
          "<p>",
          `<button type="button" onclick="addRow('${row.session_id}')">添加商品行</button>`,
          `<button class="primary" type="button" data-confirm-session="${row.session_id}" onclick="confirmAndSync('${row.session_id}')">确认并同步规则</button>`,
          `<button onclick="post('/api/v1/sessions/${row.session_id}/reject')">拒绝候选</button>`,
          "</p>",
        ].join("");
      }
      let pollTimer;
      const busySessions = new Set();
      async function load() {
        clearTimeout(pollTimer);
        const url = selected ? `/api/v1/sessions/${encodeURIComponent(selected)}` : "/api/v1/sessions";
        const response = await fetch(url);
        const payload = await response.json();
        const rows = Array.isArray(payload) ? payload : [payload];
        sessionsById = Object.fromEntries(rows.map((row) => [row.session_id, row]));
        document.querySelector("#sessions").innerHTML = rows.map((row) => `
          <article>
            <h2>识别结果 · ${statusText(row.status)}</h2>
            ${row.error ? `<p class="error">${escapeHtml(row.error)}</p>` : ""}
            ${modelInput(row)}
            ${candidateResult(row)}
            ${actions(row)}
          </article>
        `).join("");
        if (rows.some((row) => ["model_running", "approving"].includes(row.status))) pollTimer = setTimeout(load, 2000);
      }
      function readEditedRows(id) {
        const table = document.querySelector(`#result-${id}`);
        return [...table.querySelectorAll("tr")].map((row) => {
          const value = (field) => row.querySelector(`[data-field="${field}"]`).value.trim();
          return {
            product: value("product"),
            sales_attr1: value("sales_attr1"),
            sales_attr2: value("sales_attr2"),
            quantity: Number(value("quantity")),
            remark: value("remark"),
          };
        });
      }
      function addRow(id) {
        const table = document.querySelector(`#result-${id}`);
        const row = table.querySelector("tr").cloneNode(true);
        row.querySelectorAll("input").forEach((input) => { input.value = input.type === "number" ? "1" : ""; });
        table.appendChild(row);
      }
      async function waitForCandidate(id) {
        for (let attempt = 0; attempt < 150; attempt += 1) {
          const response = await fetch(`/api/v1/sessions/${id}`);
          const session = await response.json();
          if (session.status !== "model_running") return session;
          await new Promise((resolve) => setTimeout(resolve, 2000));
        }
        return { status: "model_running" };
      }
      async function confirmAndSync(id) {
        if (busySessions.has(id)) return;
        busySessions.add(id);
        const button = document.querySelector(`[data-confirm-session="${id}"]`);
        const status = document.querySelector("#operation-status");
        if (button) {
          button.disabled = true;
          button.textContent = "正在处理…";
        }
        status.textContent = "正在根据修改结果生成并校验规则，请稍候，通常需要几十秒。";
        try {
          const rows = readEditedRows(id);
          if (rows.some((row) => !row.product || !Number.isInteger(row.quantity) || row.quantity < 1)) {
            window.alert("商品不能为空，数量必须是大于 0 的整数。");
            return;
          }
          const note = document.querySelector(`#feedback-${id}`).value.trim();
          const original = candidateRows(sessionsById[id]).map((row) => ({
            product: String(row.product ?? ""),
            sales_attr1: String(row.sales_attr1 ?? ""),
            sales_attr2: String(row.sales_attr2 ?? ""),
            quantity: Number(row.quantity),
            remark: String(row.remark ?? ""),
          }));
          let session = sessionsById[id];
          if (note || session.status !== "ai_rule_pending" || JSON.stringify(rows) !== JSON.stringify(original)) {
            const feedback = await post(`/api/v1/sessions/${id}/feedback`, { corrected_rows: rows, note }, false);
            if (!feedback) return;
            sessionsById[id] = feedback;
            session = await waitForCandidate(id);
          }
          if (session.status !== "ai_rule_pending") {
            document.querySelector("#operation-error").textContent = session.status === "model_running"
              ? "AI 仍在生成规则，请稍后再试。"
              : session.error || "规则还不能通过校验，请继续修改后再确认。";
            await load();
            return;
          }
          await post(`/api/v1/sessions/${id}/approve`);
        } finally {
          busySessions.delete(id);
          status.textContent = "";
          const currentButton = document.querySelector(`[data-confirm-session="${id}"]`);
          if (currentButton) {
            currentButton.disabled = false;
            currentButton.textContent = "确认并同步规则";
          }
        }
      }
      load().catch((error) => { document.querySelector("#sessions").textContent = error.message; });
    </script>
  </body>
</html>
