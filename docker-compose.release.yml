name: cargo-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ghcr.io/ndlg/cargo-platform-backend:${CARGO_PLATFORM_VERSION:?set CARGO_PLATFORM_VERSION}
    container_name: cargo-platform-backend
    environment:
      APP_NAME: Cargo Platform
      APP_VERSION: ${CARGO_PLATFORM_VERSION:?set CARGO_PLATFORM_VERSION}
      API_PREFIX: /api/v1
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174}
      DATABASE_URL: sqlite:////data/cargo-platform.db
      STORAGE_ROOT: /data/workspaces
      DEFAULT_WORKSPACE_ID: 1
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      COLLECTOR_TOKEN_HASH_KEY: ${COLLECTOR_TOKEN_HASH_KEY:?set COLLECTOR_TOKEN_HASH_KEY}
      COLLECTOR_TOKEN_PREVIOUS_HASH_KEY: ${COLLECTOR_TOKEN_PREVIOUS_HASH_KEY:-}
      INITIAL_SETUP_TOKEN: ${INITIAL_SETUP_TOKEN:?set INITIAL_SETUP_TOKEN}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      AUTO_CREATE_TABLES: "true"
      WAYBILL_PARSER_URL: http://waybill-parser:8010
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cargo-platform-data:/data
    depends_on:
      waybill-parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  waybill-parser:
    image: ghcr.io/ndlg/cargo-platform-waybill-parser:${CARGO_PLATFORM_VERSION:?set CARGO_PLATFORM_VERSION}
    container_name: cargo-platform-waybill-parser
    environment:
      APP_VERSION: ${CARGO_PLATFORM_VERSION:?set CARGO_PLATFORM_VERSION}
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  tenant-ui:
    image: ghcr.io/ndlg/cargo-platform-tenant-ui:${CARGO_PLATFORM_VERSION:?set CARGO_PLATFORM_VERSION}
    container_name: cargo-platform-tenant-ui
    environment:
      API_PROXY_PASS: http://backend:8000
      SPA_FALLBACK: /index.html
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "0.0.0.0:5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  platform-admin-ui:
    image: ghcr.io/ndlg/cargo-platform-admin-ui:${CARGO_PLATFORM_VERSION:?set CARGO_PLATFORM_VERSION}
    container_name: cargo-platform-admin-ui
    environment:
      API_PROXY_PASS: http://backend:8000
      SPA_FALLBACK: /server-admin.html
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

volumes:
  cargo-platform-data:
    external: true
    name: cargo-platform-data
