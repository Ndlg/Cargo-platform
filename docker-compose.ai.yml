services:
  local-model:
    image: ollama/ollama:latest
    container_name: cargo-platform-local-model
    gpus: all
    volumes:
      - cargo-platform-ai-model:/root/.ollama
    restart: unless-stopped

  ai-recognition:
    image: ghcr.io/ndlg/cargo-platform-ai-recognition:${CARGO_PLATFORM_VERSION:-0.2.0-rc.1}
    container_name: cargo-platform-ai-recognition
    depends_on:
      - local-model
    environment:
      APP_VERSION: ${CARGO_PLATFORM_VERSION:-0.2.0-rc.1}
      AI_RECOGNITION_DB: /data/ai-recognition.db
      AI_RECOGNITION_INTERNAL_TOKEN: ${AI_RECOGNITION_INTERNAL_TOKEN:?set AI_RECOGNITION_INTERNAL_TOKEN}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
      OLLAMA_URL: http://local-model:11434
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-30}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-1024}
      PLATFORM_INTERNAL_URL: http://backend:8000/api/v1
    volumes:
      - cargo-platform-ai-sessions:/data
    restart: unless-stopped

  waybill-parser:
    environment:
      AI_RECOGNITION_INTERNAL_TOKEN: ${AI_RECOGNITION_INTERNAL_TOKEN:?set AI_RECOGNITION_INTERNAL_TOKEN}
      AI_RECOGNITION_URL: http://ai-recognition:8011

  backend:
    environment:
      AI_RECOGNITION_URL: http://ai-recognition:8011
      AI_RECOGNITION_ENABLED: "true"
      AI_RECOGNITION_INTERNAL_TOKEN: ${AI_RECOGNITION_INTERNAL_TOKEN:?set AI_RECOGNITION_INTERNAL_TOKEN}

volumes:
  cargo-platform-ai-model:
    name: cargo-platform-ai-model
  cargo-platform-ai-sessions:
    name: cargo-platform-ai-sessions
