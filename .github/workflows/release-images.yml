name: Release Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, for example 0.1.0"
        required: true
        default: "0.2.0-rc.1"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ndlg

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  collector:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: collector-client/requirements-build.lock

      - name: Build and verify collector release
        shell: pwsh
        run: >-
          ./scripts/build_collector_release.ps1
          -Version "${{ needs.version.outputs.value }}"
          -GitSha "${{ github.sha }}"
          -PythonExe (Get-Command python.exe).Source

      - uses: actions/upload-artifact@v4
        with:
          name: collector-release-${{ needs.version.outputs.value }}
          if-no-files-found: error
          path: |
            collector-client/dist/Cargo Platform 采集器.exe
            collector-client/dist/collector-manifest.json

  build:
    needs: [version, collector]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cargo-platform-backend
            context: .
            dockerfile: backend/Dockerfile
            build_args: ""
          - image: cargo-platform-tenant-ui
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              BUILD_COMMAND=build:tenant
              DIST_DIR=dist
          - image: cargo-platform-admin-ui
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              BUILD_COMMAND=build:server-admin
              DIST_DIR=dist-server-admin
          - image: cargo-platform-waybill-parser
            context: .
            dockerfile: services/waybill-parser/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collector-release-${{ needs.version.outputs.value }}
          path: collector-client/dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ needs.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:latest
