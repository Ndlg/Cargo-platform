name: Release Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable image version, for example 1.0.0"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: cargo-platform-release-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ndlg

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  collector:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install collector build Python
        shell: pwsh
        run: uv python install 3.12.13

      - name: Build and verify collector release
        shell: pwsh
        run: |
          $python = (uv python find 3.12.13).Trim()
          ./scripts/build_collector_release.ps1 `
            -Version "${{ needs.version.outputs.value }}" `
            -GitSha "${{ github.sha }}" `
            -PythonExe $python

      - uses: actions/upload-artifact@v4
        with:
          name: collector-release-${{ needs.version.outputs.value }}
          if-no-files-found: error
          path: |
            collector-client/dist/Cargo Platform 采集器.exe
            collector-client/dist/collector-manifest.json

  server-check:
    needs: [version, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server deployment bundle
        run: |
          python scripts/build_server_release.py \
            --root . \
            --version "${{ needs.version.outputs.value }}" \
            --git-sha "${{ github.sha }}" \
            --output-dir server-release

      - uses: actions/upload-artifact@v4
        with:
          name: server-release-${{ needs.version.outputs.value }}
          if-no-files-found: error
          path: server-release/*

  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite:////tmp/cargo-platform-ci.db
      STORAGE_ROOT: /tmp/cargo-platform-storage
      AUTO_CREATE_TABLES: "true"
      SECRET_KEY: backend-ci-secret-key-at-least-32-bytes
      COLLECTOR_TOKEN_HASH_KEY: collector-ci-hash-key-at-least-32-bytes
      INITIAL_SETUP_TOKEN: setup-ci-token-at-least-32-bytes
      BOOTSTRAP_ADMIN_PASSWORD: admin123
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            services/waybill-parser/requirements.txt

      - name: Backend tests and Python dependency audit
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt pip-audit
          python -m pytest backend/tests -q
          pip-audit -r backend/requirements.txt --progress-spinner off
          pip-audit -r services/waybill-parser/requirements.txt --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks and production dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run build:tenant
          npm run build:server-admin

  build:
    needs: [version, collector, server-check, quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cargo-platform-backend
            context: .
            dockerfile: backend/Dockerfile
            build_args: ""
          - image: cargo-platform-tenant-ui
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              BUILD_COMMAND=build:tenant
              DIST_DIR=dist
          - image: cargo-platform-admin-ui
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              BUILD_COMMAND=build:server-admin
              DIST_DIR=dist-server-admin
          - image: cargo-platform-waybill-parser
            context: .
            dockerfile: services/waybill-parser/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collector-release-${{ needs.version.outputs.value }}
          path: collector-client/dist

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build_args }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Save image digest
        shell: bash
        run: |
          digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest: $digest" >&2; exit 1; }
          mkdir -p /tmp/digests
          printf '%s\n' "$digest" >"/tmp/digests/${{ matrix.image }}.digest"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          if-no-files-found: error
          path: /tmp/digests/${{ matrix.image }}.digest

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish complete immutable release
        shell: bash
        run: |
          set -euo pipefail
          images=(cargo-platform-backend cargo-platform-tenant-ui cargo-platform-admin-ui cargo-platform-waybill-parser)

          for image in "${images[@]}"; do
            file="/tmp/digests/$image.digest"
            test -s "$file" || { echo "Missing digest for $image" >&2; exit 1; }
            digest="$(tr -d '[:space:]' <"$file")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid digest for $image" >&2; exit 1; }
            source_ref="${REGISTRY}/${IMAGE_OWNER}/${image}@${digest}"
            platforms="$(docker buildx imagetools inspect "$source_ref")"
            grep -q 'linux/amd64' <<<"$platforms" || { echo "$image is missing linux/amd64" >&2; exit 1; }
            grep -q 'linux/arm64' <<<"$platforms" || { echo "$image is missing linux/arm64" >&2; exit 1; }
          done

          for image in "${images[@]}"; do
            digest="$(tr -d '[:space:]' <"/tmp/digests/$image.digest")"
            tag="${REGISTRY}/${IMAGE_OWNER}/${image}:${{ needs.version.outputs.value }}"
            if output="$(docker buildx imagetools inspect "$tag" 2>&1)"; then
              existing="$(awk '/^Digest:/ {print $2; exit}' <<<"$output")"
              [ "$existing" = "$digest" ] || { echo "Refusing mismatched existing tag: $tag" >&2; exit 1; }
            elif ! grep -Eqi 'manifest unknown|no such manifest|not found' <<<"$output"; then
              echo "Unable to verify release tag; refusing publish: $tag" >&2
              exit 1
            fi
          done

          for image in "${images[@]}"; do
            digest="$(tr -d '[:space:]' <"/tmp/digests/$image.digest")"
            tag="${REGISTRY}/${IMAGE_OWNER}/${image}:${{ needs.version.outputs.value }}"
            if output="$(docker buildx imagetools inspect "$tag" 2>&1)"; then
              current="$(awk '/^Digest:/ {print $2; exit}' <<<"$output")"
              [ "$current" = "$digest" ] || { echo "Refusing mismatched existing tag: $tag" >&2; exit 1; }
            elif grep -Eqi 'manifest unknown|no such manifest|not found' <<<"$output"; then
              docker buildx imagetools create -t "$tag" "${REGISTRY}/${IMAGE_OWNER}/${image}@${digest}"
            else
              echo "Unable to verify release tag; refusing publish: $tag" >&2
              exit 1
            fi
            published="$(docker buildx imagetools inspect "$tag" | awk '/^Digest:/ {print $2; exit}')"
            [ "$published" = "$digest" ] || { echo "Published digest mismatch: $tag" >&2; exit 1; }
          done

  release:
    if: github.event_name == 'push'
    needs: [version, collector, server-check, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: collector-release-${{ needs.version.outputs.value }}
          path: collector-release

      - uses: actions/download-artifact@v4
        with:
          name: server-release-${{ needs.version.outputs.value }}
          path: server-release

      - name: Publish verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing GitHub Release: $tag" >&2
            exit 1
          fi
          created_by_this_run=0
          cleanup_draft() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$created_by_this_run" -eq 1 ] && [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" = true ]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
            exit "$status"
          }
          trap cleanup_draft EXIT
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Cargo Platform ${{ needs.version.outputs.value }}" \
            --generate-notes
          created_by_this_run=1
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            server-release/* \
            "collector-release/Cargo Platform 采集器.exe" \
            collector-release/collector-manifest.json
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          trap - EXIT
