name: Release Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable image version, for example 1.0.0-rc.1"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cargo-platform-release-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ndlg

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  collector:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: collector-client/requirements-build.lock

      - name: Build and verify collector release
        shell: pwsh
        run: >-
          ./scripts/build_collector_release.ps1
          -Version "${{ needs.version.outputs.value }}"
          -GitSha "${{ github.sha }}"
          -PythonExe (Get-Command python.exe).Source

      - uses: actions/upload-artifact@v4
        with:
          name: collector-release-${{ needs.version.outputs.value }}
          if-no-files-found: error
          path: |
            collector-client/dist/Cargo Platform 采集器.exe
            collector-client/dist/collector-manifest.json

  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite:////tmp/cargo-platform-ci.db
      STORAGE_ROOT: /tmp/cargo-platform-storage
      AUTO_CREATE_TABLES: "true"
      SECRET_KEY: backend-ci-secret-key-at-least-32-bytes
      COLLECTOR_TOKEN_HASH_KEY: collector-ci-hash-key-at-least-32-bytes
      INITIAL_SETUP_TOKEN: setup-ci-token-at-least-32-bytes
      BOOTSTRAP_ADMIN_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            services/waybill-parser/requirements.txt

      - name: Backend tests and Python dependency audit
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt pip-audit
          python -m pytest backend/tests -q
          pip-audit -r backend/requirements.txt --progress-spinner off
          pip-audit -r services/waybill-parser/requirements.txt --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks and production dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run build:tenant
          npm run build:server-admin

  immutable-tags:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing release tags
        shell: bash
        run: |
          for image in cargo-platform-backend cargo-platform-tenant-ui cargo-platform-admin-ui cargo-platform-waybill-parser; do
            tag="${REGISTRY}/${IMAGE_OWNER}/${image}:${{ needs.version.outputs.value }}"
            if output="$(docker manifest inspect "$tag" 2>&1)"; then
              echo "Refusing to overwrite existing release tag: $tag" >&2
              exit 1
            fi
            if ! grep -Eqi 'manifest unknown|no such manifest' <<<"$output"; then
              echo "Unable to verify release tag; refusing publish: $tag" >&2
              exit 1
            fi
          done

  build:
    needs: [version, collector, quality, immutable-tags]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cargo-platform-backend
            context: .
            dockerfile: backend/Dockerfile
            build_args: ""
          - image: cargo-platform-tenant-ui
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              BUILD_COMMAND=build:tenant
              DIST_DIR=dist
          - image: cargo-platform-admin-ui
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              BUILD_COMMAND=build:server-admin
              DIST_DIR=dist-server-admin
          - image: cargo-platform-waybill-parser
            context: .
            dockerfile: services/waybill-parser/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: collector-release-${{ needs.version.outputs.value }}
          path: collector-client/dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ needs.version.outputs.value }}
